name: RLAI corpus staging

on:
  push:
    branches:
      - rlai-corpus-staging-20260827
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download pinned public sources
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p corpus/abcd corpus/dolly corpus/oasst corpus/cornell corpus/gsm8k
          : > corpus/DOWNLOAD-STATUS.tsv
          fetch() {
            local name="$1" url="$2" dest="$3"
            if curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 "$url" -o "$dest"; then
              printf '%s\tOK\t%s\n' "$name" "$(stat -c %s "$dest")" >> corpus/DOWNLOAD-STATUS.tsv
            else
              rm -f "$dest"
              printf '%s\tFAILED\t0\n' "$name" >> corpus/DOWNLOAD-STATUS.tsv
            fi
          }
          fetch abcd-data \
            'https://raw.githubusercontent.com/asappresearch/abcd/6b8700ce67c6b37b062dd7a60abc76d7ef832a97/data/abcd_v1.1.json.gz' \
            corpus/abcd/abcd_v1.1.json.gz
          fetch abcd-guidelines \
            'https://raw.githubusercontent.com/asappresearch/abcd/6b8700ce67c6b37b062dd7a60abc76d7ef832a97/data/guidelines.json' \
            corpus/abcd/guidelines.json
          fetch abcd-ontology \
            'https://raw.githubusercontent.com/asappresearch/abcd/6b8700ce67c6b37b062dd7a60abc76d7ef832a97/data/ontology.json' \
            corpus/abcd/ontology.json
          fetch abcd-license \
            'https://raw.githubusercontent.com/asappresearch/abcd/6b8700ce67c6b37b062dd7a60abc76d7ef832a97/LICENSE' \
            corpus/abcd/LICENSE
          fetch dolly \
            'https://huggingface.co/datasets/databricks/databricks-dolly-15k/resolve/main/databricks-dolly-15k.jsonl?download=true' \
            corpus/dolly/databricks-dolly-15k.jsonl
          fetch oasst \
            'https://huggingface.co/datasets/OpenAssistant/oasst1/resolve/main/2023-04-12_oasst_all.messages.jsonl.gz?download=true' \
            corpus/oasst/2023-04-12_oasst_all.messages.jsonl.gz
          fetch oasst-license \
            'https://huggingface.co/datasets/OpenAssistant/oasst1/resolve/main/LICENSE?download=true' \
            corpus/oasst/LICENSE
          fetch cornell-lines \
            'https://raw.githubusercontent.com/Currie32/Chatbot-from-Movie-Dialogue/702df55ff6e2dbe4c7c1771ec25cdf44893df159/movie_lines.txt.zip' \
            corpus/cornell/movie_lines.txt.zip
          fetch cornell-conversations \
            'https://raw.githubusercontent.com/Currie32/Chatbot-from-Movie-Dialogue/702df55ff6e2dbe4c7c1771ec25cdf44893df159/movie_conversations.txt.zip' \
            corpus/cornell/movie_conversations.txt.zip
          fetch gsm8k-train \
            'https://raw.githubusercontent.com/openai/grade-school-math/3101c7d5072418e28b9008a6636bde82a006892c/grade_school_math/data/train.jsonl' \
            corpus/gsm8k/train.jsonl
          fetch gsm8k-test \
            'https://raw.githubusercontent.com/openai/grade-school-math/3101c7d5072418e28b9008a6636bde82a006892c/grade_school_math/data/test.jsonl' \
            corpus/gsm8k/test.jsonl
          cat corpus/DOWNLOAD-STATUS.tsv
          test "$(find corpus -type f ! -name DOWNLOAD-STATUS.tsv | wc -l)" -ge 6
      - name: Record exact hashes and provenance
        shell: bash
        run: |
          set -euo pipefail
          find corpus -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > corpus/SHA256SUMS.txt
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path('corpus')
          files = []
          for path in sorted(p for p in root.rglob('*') if p.is_file() and p.name != 'MANIFEST.json'):
              files.append({
                  'path': path.relative_to(root).as_posix(),
                  'size_bytes': path.stat().st_size,
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
              })
          (root / 'MANIFEST.json').write_text(json.dumps({
              'schema': 'rlai.training-sources.v2',
              'created_by': 'github-actions',
              'source_urls_are_revision_pinned_where_available': True,
              'files': files,
          }, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Upload corpus bundle
        uses: actions/upload-artifact@v4
        with:
          name: rlai-training-sources-20260827
          path: corpus
          if-no-files-found: error
          compression-level: 6
          retention-days: 7
